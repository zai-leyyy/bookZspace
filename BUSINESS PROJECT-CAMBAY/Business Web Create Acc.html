<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookZzz Space - Signup</title>

    <link rel="stylesheet" href="signup.css">
</head>

<body>        

<div class="signup-card">

    <!-- Icon -->
    <div class="signup-icon">
        ✦
    </div>

    <h1>Create an Account</h1>

    <p class="subtitle">
        Create your account and start your reading journey with us.
    </p>

    <form>

        <!-- Full Name -->
        <div class="input-box">
            <span>👤</span>
            <input 
                type="text" 
                placeholder="Full Name" 
                required
            >
        </div>

        <!-- Email -->
        <div class="input-box">
            <span>✉</span>
            <input 
                type="email" 
                placeholder="Email" 
                required
            >
        </div>

        <!-- Password -->
        <div class="input-box password-box">
            <span>🔒</span>

            <input 
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button 
                type="button" 
                id="togglePassword"
            >
                👁
            </button>
        </div>

        <!-- Confirm Password -->
        <div class="input-box password-box">
            <span>🔒</span>

            <input 
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                required
            >

            <button 
                type="button" 
                id="toggleConfirm"
            >
                👁
            </button>
        </div>

        <!-- Create Account Button -->
        <button type="submit" class="signup-button">
            Create Account
        </button>

    </form>

    <!-- Login Link -->
    <p class="login-text">
        Already have an account?
        <a href="file:///F:/BUSINESS%20PROJECT-CAMBAY/Business%20Web%20Log-In.html">Log In</a>
    </p>

    <!-- Divider -->
    <div class="divider">
        <span>Or sign up with</span>
    </div>

    <!-- Social -->
    <div class="social-buttons">
        <button>G</button>
        <button>f</button>
    </div>

</div>

    <script src="signjava.js"></script>

</body>
</html>
